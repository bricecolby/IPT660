<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Mastery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg bg-white" aria-label="Primary navigation">
      <div class="container-fluid app-nav">
        <a class="navbar-brand" href="#" data-tab="learn">Pokémon Mastery</a>

        <div class="nav-tabs-wrap" role="tablist" aria-label="Main sections">
          <button class="nav-tab active" type="button" role="tab" aria-selected="true" data-tab="learn">Learn</button>
          <button class="nav-tab" type="button" role="tab" aria-selected="false" data-tab="team">Team</button>
          <button class="nav-tab nav-tab-locked" type="button" role="tab" aria-selected="false" data-tab="battle"><span aria-hidden="true">▢</span> Battle</button>
          <button class="nav-tab" type="button" role="tab" aria-selected="false" data-tab="dashboard">Dashboard</button>
        </div>

        <div class="progress-summary" aria-live="polite">
          <span id="progress-label">0 of 0 sections</span>
          <div class="progress progress-track" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="app" class="app-main" tabindex="-1">
    <div class="loading-state" role="status">
      <div class="spinner-border spinner-border-sm me-2" aria-hidden="true"></div>
      Loading lesson content…
    </div>
  </main>

  <script src="js/content-loader.js?v=3"></script>
  <script src="js/session-tracker.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/quiz-view.js"></script>
  <script src="js/lesson-view.js"></script>
  <script src="js/type-chart.js"></script>
  <script src="js/team-critic.js"></script>
  <script src="js/team-builder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
